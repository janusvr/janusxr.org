<!--
  janusxr.org landing room — greybox (SPACE.md layout)
  Architecture lives in models/lobby.glb, generated by tools/build-lobby-glb.py —
  regenerate rather than hand-editing geometry. This file owns everything else:
  spawn, water, wayfinding text, portals, DOM mounts, and the vp-* viewpoint
  markers read by js/reveal.js for the document-mode camera.
  Bearings (south entry at 180°): whatis SW, explore N, get NE, build E, timeline SE.
-->
<html>
<head><title>JanusXR — the lobby</title></head>
<body>
<FireBoxRoom>
<Assets>
  <AssetObject id="lobby" src="models/lobby.glb" />
  <AssetObject id="coin" src="models/coin.glb" />
  <AssetImage id="sky-front" src="skybox/front.png" />
  <AssetImage id="sky-back"  src="skybox/back.png" />
  <AssetImage id="sky-left"  src="skybox/left.png" />
  <AssetImage id="sky-right" src="skybox/right.png" />
  <AssetImage id="sky-up"    src="skybox/up.png" />
  <AssetImage id="sky-down"  src="skybox/down.png" />
  <AssetScript src="lobby.js" />
</Assets>
<Room js_id="plaza" pos="0 0 26" fwd="0 0 -1"
      skybox_front_id="sky-front" skybox_back_id="sky-back" skybox_left_id="sky-left"
      skybox_right_id="sky-right" skybox_up_id="sky-up" skybox_down_id="sky-down"
      fog="true" fog_mode="exp" fog_density="0.0035" fog_col="#0c0f0c">

  <!-- ===== architecture (visual only — collision is the proxy boxes below) ===== -->
  <Object id="lobby" js_id="lobby-architecture" pos="0 0 0" />

  <!-- ===== collision proxies =====
       Invisible primitive boxes. Mesh colliders (even low-poly ones) degenerate the
       physics broadphase octree: large flat overlapping AABBs subdivide to max depth
       and _collectPairs dominates the frame (profiled at 93% CPU, 0.2fps). Primitive
       boxes with distinct AABBs stay on the fast path. -->
  <Object id="cube" js_id="col-plaza"      pos="0 -0.25 0"        scale="34 0.5 34"  visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-corridor"   pos="0 -0.25 22"       scale="7 0.5 18"   visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-wing-whatis"   pos="-13.52 -0.24 18.61" scale="8 0.48 18" visible="false" collision_id="cube" xdir="0.8090 0 0.5878" ydir="0 1 0" zdir="-0.5878 0 0.8090" />
  <Object id="cube" js_id="col-wing-explore"  pos="-21.88 -0.24 -7.11" scale="8 0.48 18" visible="false" collision_id="cube" xdir="-0.3090 0 0.9511" ydir="0 1 0" zdir="-0.9511 0 -0.3090" />
  <Object id="cube" js_id="col-wing-get"      pos="0 -0.24 -23" scale="8 0.48 18" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-wing-build"    pos="21.88 -0.24 -7.11" scale="8 0.48 18" visible="false" collision_id="cube" xdir="-0.3090 0 -0.9511" ydir="0 1 0" zdir="0.9511 0 -0.3090" />
  <Object id="cube" js_id="col-wing-timeline" pos="13.52 -0.24 18.61" scale="8 0.48 18" visible="false" collision_id="cube" xdir="0.8090 0 -0.5878" ydir="0 1 0" zdir="0.5878 0 0.8090" />
  <Object id="cube" js_id="col-basin"    pos="0 0.45 0" scale="7.2 0.9 7.2" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-pedestal" pos="0 2.5 0"  scale="1.8 4.2 1.8" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-booth"    pos="4.5 1.1 4.5" scale="1.4 2.2 0.35" visible="false" collision_id="cube" xdir="0.7071 0 0.7071" ydir="0 1 0" zdir="-0.7071 0 0.7071" />

  <!-- ===== monument ===== -->
  <Object id="coin" js_id="monument-coin" pos="0 7.2 0" angular="0 .2 0" lighting="false" />
  <Water js_id="fountain-water" pos="0 0.7 0" sizex="6" sizey="6" col="#153a2a" />

  <!-- ===== info booth label ===== -->
  <Text js_id="booth-info-label" pos="4.5 2.5 4.5" fwd="-0.7071 0 -0.7071" col="#43ff6e" scale="1 1 1">INFO</Text>

  <!-- ===== wing: whatis (SW) ===== -->
  <Text js_id="label-whatis" pos="-7.94 4.9 10.92" fwd="0.5878 0 -0.8090" col="#43ff6e" scale="3 3 1">WHAT IS</Text>
  <Paragraph js_id="mount-whatis" url="../index.html" selector="#whatis" pos="-18.22 3.2 25.08" fwd="0.5878 0 -0.8090" scale="8 6 1" />

  <!-- ===== wing: explore (N, axial) ===== -->
  <Text js_id="label-explore" pos="-12.84 4.9 -4.17" fwd="0.9511 0 0.3090" col="#43ff6e" scale="3 3 1">EXPLORE</Text>
  <Link js_id="portal-vesta" pos="-29.09 1.6 -12.08" fwd="0.9511 0 0.3090" url="https://vesta.janusxr.org/" title="Vesta" col="#43ff6e" />
  <Link js_id="portal-janusweb" pos="-30.63 1.6 -7.32" fwd="0.9511 0 0.3090" url="https://web.janusxr.org/" title="JanusWeb" col="#43ff6e" />

  <!-- ===== wing: get (NE) ===== -->
  <Text js_id="label-get" pos="0 4.9 -13.5" fwd="0 0 1" col="#43ff6e" scale="3 3 1">GET</Text>
  <Paragraph js_id="mount-get" url="../index.html" selector="#get" pos="0 3.2 -31" fwd="0 0 1" scale="8 6 1" />

  <!-- ===== wing: build (E) ===== -->
  <Text js_id="label-build" pos="12.84 4.9 -4.17" fwd="-0.9511 0 0.3090" col="#43ff6e" scale="3 3 1">BUILD</Text>
  <Paragraph js_id="mount-build" url="../index.html" selector="#build-opensource" pos="29.48 3.2 -9.58" fwd="-0.9511 0 0.3090" scale="8 6 1" />

  <!-- ===== wing: timeline (SE) ===== -->
  <Text js_id="label-timeline" pos="7.94 4.9 10.92" fwd="-0.5878 0 -0.8090" col="#43ff6e" scale="3 3 1">TIMELINE</Text>
  <Text js_id="label-timeline-past" pos="15.09 4.5 23.15" fwd="-0.5878 0 -0.8090" col="#2a9e4f" scale="1.2 1.2 1">&#9666; PAST</Text>
  <Text js_id="label-timeline-future" pos="17.35 4.5 21.51" fwd="-0.5878 0 -0.8090" col="#2a9e4f" scale="1.2 1.2 1">FUTURE &#9656;</Text>
  <Paragraph js_id="mount-timeline" url="../index.html" selector="#timeline-janus" pos="18.22 3.2 25.08" fwd="-0.5878 0 -0.8090" scale="8 6 1" />

  <!-- ===== viewpoint markers (invisible; read by js/reveal.js) ===== -->
  <!-- vp-hero matches the Room spawn exactly: document mode opens on the same
       view you inhabit when you press Enter — the handoff moves nothing -->
  <Object id="cube" js_id="vp-hero"     pos="0 0 26"         scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-whatis"   pos="-2.35 2 3.24"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-explore"  pos="-3.80 2 -1.24"     scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-get"      pos="0 2 -4"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-build"    pos="3.80 2 -1.24"      scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-timeline" pos="2.35 2 3.24"   scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-overview" pos="0 13 21"       scale="0.1 0.1 0.1" visible="false" collision_id="" />

</Room>
</FireBoxRoom>
</body>
</html>
