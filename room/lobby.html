<!--
  janusxr.org landing room — greybox (SPACE.md layout)
  Architecture lives in models/lobby.glb, generated by tools/build-lobby-glb.py —
  regenerate rather than hand-editing geometry. This file owns everything else:
  spawn, water, wayfinding text, portals, DOM mounts, and the vp-* viewpoint
  markers read by js/reveal.js for the document-mode camera.
  Bearings (south entry at 180°): whatis SW, explore N, get NE, build E, timeline SE.
-->
<html>
<head><title>JanusXR — the lobby</title></head>
<body>
<FireBoxRoom>
<Assets>
  <AssetObject id="lobby" src="models/lobby.glb" />
  <AssetObject id="coin" src="models/coin.glb" />
  <AssetScript src="lobby.js" />
</Assets>
<Room js_id="plaza" pos="2 0.5 6" fwd="-0.2 0 -0.98" fog="true" fog_mode="exp" fog_density="0.006" fog_col="#0c0f0c">

  <!-- ===== architecture ===== -->
  <Object id="lobby" js_id="lobby-architecture" pos="0 0 0" collision_id="lobby" />

  <!-- ===== monument ===== -->
  <Object id="coin" js_id="monument-coin" pos="0 6.2 0" rotate_deg_per_sec="20" rotate_axis="0 1 0" lighting="false" />
  <Water js_id="fountain-water" pos="0 0.7 0" sizex="6" sizey="6" col="#153a2a" />

  <!-- ===== info booth label ===== -->
  <Text js_id="booth-info-label" pos="4.5 2.5 4.5" fwd="-0.7071 0 -0.7071" col="#43ff6e" scale="1 1 1">INFO</Text>

  <!-- ===== wing: whatis (SW) ===== -->
  <Text js_id="label-whatis" pos="-9.55 6.6 9.55" fwd="0.7071 0 -0.7071" col="#43ff6e" scale="2 2 1">WHAT IS</Text>
  <Paragraph js_id="mount-whatis" url="../index.html" selector="#whatis" pos="-21.92 3.2 21.92" fwd="0.7071 0 -0.7071" scale="8 6 1" />

  <!-- ===== wing: explore (N, axial) ===== -->
  <Text js_id="label-explore" pos="0 6.6 -13.5" fwd="0 0 1" col="#43ff6e" scale="2 2 1">EXPLORE</Text>
  <Link js_id="portal-vesta" pos="-2.5 1.6 -31.4" fwd="0 0 1" url="https://vesta.janusxr.org/" title="Vesta" col="#43ff6e" />
  <Link js_id="portal-janusweb" pos="2.5 1.6 -31.4" fwd="0 0 1" url="https://web.janusxr.org/" title="JanusWeb" col="#43ff6e" />

  <!-- ===== wing: get (NE) ===== -->
  <Text js_id="label-get" pos="9.55 6.6 -9.55" fwd="-0.7071 0 0.7071" col="#43ff6e" scale="2 2 1">GET</Text>
  <Paragraph js_id="mount-get" url="../index.html" selector="#get" pos="21.92 3.2 -21.92" fwd="-0.7071 0 0.7071" scale="8 6 1" />

  <!-- ===== wing: build (E) ===== -->
  <Text js_id="label-build" pos="13.5 6.6 0" fwd="-1 0 0" col="#43ff6e" scale="2 2 1">BUILD</Text>
  <Paragraph js_id="mount-build" url="../index.html" selector="#build-opensource" pos="31 3.2 0" fwd="-1 0 0" scale="8 6 1" />

  <!-- ===== wing: timeline (SE) ===== -->
  <Text js_id="label-timeline" pos="9.55 6.6 9.55" fwd="-0.7071 0 -0.7071" col="#43ff6e" scale="2 2 1">TIMELINE</Text>
  <Text js_id="label-timeline-past" pos="18.5 4.5 20.5" fwd="-0.7071 0 -0.7071" col="#2a9e4f" scale="1.2 1.2 1">&#9666; PAST</Text>
  <Text js_id="label-timeline-future" pos="20.5 4.5 18.5" fwd="-0.7071 0 -0.7071" col="#2a9e4f" scale="1.2 1.2 1">FUTURE &#9656;</Text>
  <Paragraph js_id="mount-timeline" url="../index.html" selector="#timeline-janus" pos="21.92 3.2 21.92" fwd="-0.7071 0 -0.7071" scale="8 6 1" />

  <!-- ===== viewpoint markers (invisible; read by js/reveal.js) ===== -->
  <Object id="cube" js_id="vp-hero"     pos="0 3.2 26"      scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-whatis"   pos="-8.13 5.6 8.13"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-explore"  pos="0 5.6 -11.5"     scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-get"      pos="8.13 5.6 -8.13"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-build"    pos="11.5 5.6 0"      scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-timeline" pos="8.13 5.6 8.13"   scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-overview" pos="0 26 10"       scale="0.1 0.1 0.1" visible="false" collision_id="" />

</Room>
</FireBoxRoom>
</body>
</html>
