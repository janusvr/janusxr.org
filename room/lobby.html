<!--
  janusxr.org landing room — greybox (SPACE.md layout)
  Architecture lives in models/lobby.glb, generated by tools/build-lobby-glb.py —
  regenerate rather than hand-editing geometry. This file owns everything else:
  spawn, water, wayfinding text, portals, DOM mounts, and the vp-* viewpoint
  markers read by js/reveal.js for the document-mode camera.
  Bearings (south entry at 180°): whatis SW, explore N, get NE, build E, timeline SE.
-->
<html>
<head><title>JanusXR — the lobby</title></head>
<body>
<FireBoxRoom>
<Assets>
  <AssetObject id="lobby" src="models/lobby.glb" />
  <AssetObject id="coin" src="models/coin.glb" />
  <AssetImage id="sky-front" src="skybox/front.png" />
  <AssetImage id="sky-back"  src="skybox/back.png" />
  <AssetImage id="sky-left"  src="skybox/left.png" />
  <AssetImage id="sky-right" src="skybox/right.png" />
  <AssetImage id="sky-up"    src="skybox/up.png" />
  <AssetImage id="sky-down"  src="skybox/down.png" />
  <AssetScript src="lobby.js" />
</Assets>
<Room js_id="plaza" pos="0 0 26" fwd="0 0 -1"
      skybox_front_id="sky-front" skybox_back_id="sky-back" skybox_left_id="sky-left"
      skybox_right_id="sky-right" skybox_up_id="sky-up" skybox_down_id="sky-down"
      fog="true" fog_mode="exp" fog_density="0.0035" fog_col="#0c0f0c">

  <!-- ===== architecture (visual only — collision is the proxy boxes below) ===== -->
  <Object id="lobby" js_id="lobby-architecture" pos="0 0 0" />

  <!-- ===== collision proxies =====
       Invisible primitive boxes. Mesh colliders (even low-poly ones) degenerate the
       physics broadphase octree: large flat overlapping AABBs subdivide to max depth
       and _collectPairs dominates the frame (profiled at 93% CPU, 0.2fps). Primitive
       boxes with distinct AABBs stay on the fast path. -->
  <Object id="cube" js_id="col-plaza"      pos="0 -0.25 0"        scale="34 0.5 34"  visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-corridor"   pos="0 -0.25 22"       scale="7 0.5 18"   visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-wing-whatis"   pos="-16.26 -0.24 16.26" scale="8 0.48 18" visible="false" collision_id="cube" xdir="0.7071 0 0.7071" ydir="0 1 0" zdir="-0.7071 0 0.7071" />
  <Object id="cube" js_id="col-wing-explore"  pos="0 -0.24 -23"       scale="8 0.48 18" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-wing-get"      pos="16.26 -0.24 -16.26" scale="8 0.48 18" visible="false" collision_id="cube" xdir="-0.7071 0 -0.7071" ydir="0 1 0" zdir="0.7071 0 -0.7071" />
  <Object id="cube" js_id="col-wing-build"    pos="23 -0.24 0"        scale="8 0.48 18" visible="false" collision_id="cube" xdir="0 0 -1" ydir="0 1 0" zdir="1 0 0" />
  <Object id="cube" js_id="col-wing-timeline" pos="16.26 -0.24 16.26" scale="8 0.48 18" visible="false" collision_id="cube" xdir="0.7071 0 -0.7071" ydir="0 1 0" zdir="0.7071 0 0.7071" />
  <Object id="cube" js_id="col-mezz-1" pos="4.07 3.85 -9.82"  scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="-0.3827 0 0.9239" ydir="0 1 0" zdir="-0.9239 0 -0.3827" />
  <Object id="cube" js_id="col-mezz-2" pos="9.82 3.85 -4.07"  scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="-0.9239 0 0.3827" ydir="0 1 0" zdir="-0.3827 0 -0.9239" />
  <Object id="cube" js_id="col-mezz-3" pos="9.82 3.85 4.07"   scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="-0.9239 0 -0.3827" ydir="0 1 0" zdir="0.3827 0 -0.9239" />
  <!-- south segments shortened: the ring is cut open 160°–200° over the entry axis -->
  <Object id="cube" js_id="col-mezz-4" pos="5.71 3.85 8.96"   scale="3 0.3 4.6" visible="false" collision_id="cube" xdir="-0.537 0 -0.843" ydir="0 1 0" zdir="0.843 0 -0.537" />
  <Object id="cube" js_id="col-mezz-5" pos="-5.71 3.85 8.96"  scale="3 0.3 4.6" visible="false" collision_id="cube" xdir="0.537 0 -0.843" ydir="0 1 0" zdir="0.843 0 0.537" />
  <Object id="cube" js_id="col-mezz-6" pos="-9.82 3.85 4.07"  scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="0.9239 0 -0.3827" ydir="0 1 0" zdir="0.3827 0 0.9239" />
  <Object id="cube" js_id="col-mezz-7" pos="-9.82 3.85 -4.07" scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="0.9239 0 0.3827" ydir="0 1 0" zdir="-0.3827 0 0.9239" />
  <Object id="cube" js_id="col-mezz-8" pos="-4.07 3.85 -9.82" scale="3 0.3 8.8" visible="false" collision_id="cube" xdir="0.3827 0 0.9239" ydir="0 1 0" zdir="-0.9239 0 0.3827" />
  <Object id="cube" js_id="col-ramp-w" pos="-9.8 1.9 9.5" scale="3 0.2 11.7" visible="false" collision_id="cube" xdir="-1 0 0" ydir="0 0.940 0.342" zdir="0 0.342 -0.940" />
  <Object id="cube" js_id="col-ramp-e" pos="9.8 1.9 9.5"  scale="3 0.2 11.7" visible="false" collision_id="cube" xdir="-1 0 0" ydir="0 0.940 0.342" zdir="0 0.342 -0.940" />
  <Object id="cube" js_id="col-basin"    pos="0 0.45 0" scale="7.2 0.9 7.2" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-pedestal" pos="0 2.5 0"  scale="1.8 4.2 1.8" visible="false" collision_id="cube" />
  <Object id="cube" js_id="col-booth"    pos="4.5 1.1 4.5" scale="1.4 2.2 0.35" visible="false" collision_id="cube" xdir="0.7071 0 0.7071" ydir="0 1 0" zdir="-0.7071 0 0.7071" />

  <!-- ===== monument ===== -->
  <Object id="coin" js_id="monument-coin" pos="0 7.2 0" angular="0 .2 0" lighting="false" />
  <Water js_id="fountain-water" pos="0 0.7 0" sizex="6" sizey="6" col="#153a2a" />

  <!-- ===== info booth label ===== -->
  <Text js_id="booth-info-label" pos="4.5 2.5 4.5" fwd="-0.7071 0 -0.7071" col="#43ff6e" scale="1 1 1">INFO</Text>

  <!-- ===== wing: whatis (SW) ===== -->
  <Text js_id="label-whatis" pos="-9.55 6.6 9.55" fwd="0.7071 0 -0.7071" col="#43ff6e" scale="2 2 1">WHAT IS</Text>
  <Paragraph js_id="mount-whatis" url="../index.html" selector="#whatis" pos="-21.92 3.2 21.92" fwd="0.7071 0 -0.7071" scale="8 6 1" />

  <!-- ===== wing: explore (N, axial) ===== -->
  <Text js_id="label-explore" pos="0 6.6 -13.5" fwd="0 0 1" col="#43ff6e" scale="2 2 1">EXPLORE</Text>
  <Link js_id="portal-vesta" pos="-2.5 1.6 -31.4" fwd="0 0 1" url="https://vesta.janusxr.org/" title="Vesta" col="#43ff6e" />
  <Link js_id="portal-janusweb" pos="2.5 1.6 -31.4" fwd="0 0 1" url="https://web.janusxr.org/" title="JanusWeb" col="#43ff6e" />

  <!-- ===== wing: get (NE) ===== -->
  <Text js_id="label-get" pos="9.55 6.6 -9.55" fwd="-0.7071 0 0.7071" col="#43ff6e" scale="2 2 1">GET</Text>
  <Paragraph js_id="mount-get" url="../index.html" selector="#get" pos="21.92 3.2 -21.92" fwd="-0.7071 0 0.7071" scale="8 6 1" />

  <!-- ===== wing: build (E) ===== -->
  <Text js_id="label-build" pos="13.5 6.6 0" fwd="-1 0 0" col="#43ff6e" scale="2 2 1">BUILD</Text>
  <Paragraph js_id="mount-build" url="../index.html" selector="#build-opensource" pos="31 3.2 0" fwd="-1 0 0" scale="8 6 1" />

  <!-- ===== wing: timeline (SE) ===== -->
  <Text js_id="label-timeline" pos="9.55 6.6 9.55" fwd="-0.7071 0 -0.7071" col="#43ff6e" scale="2 2 1">TIMELINE</Text>
  <Text js_id="label-timeline-past" pos="18.5 4.5 20.5" fwd="-0.7071 0 -0.7071" col="#2a9e4f" scale="1.2 1.2 1">&#9666; PAST</Text>
  <Text js_id="label-timeline-future" pos="20.5 4.5 18.5" fwd="-0.7071 0 -0.7071" col="#2a9e4f" scale="1.2 1.2 1">FUTURE &#9656;</Text>
  <Paragraph js_id="mount-timeline" url="../index.html" selector="#timeline-janus" pos="21.92 3.2 21.92" fwd="-0.7071 0 -0.7071" scale="8 6 1" />

  <!-- ===== viewpoint markers (invisible; read by js/reveal.js) ===== -->
  <!-- vp-hero matches the Room spawn exactly: document mode opens on the same
       view you inhabit when you press Enter — the handoff moves nothing -->
  <Object id="cube" js_id="vp-hero"     pos="0 0 26"         scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-whatis"   pos="-8.13 5.6 8.13"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-explore"  pos="0 5.6 -11.5"     scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-get"      pos="8.13 5.6 -8.13"  scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-build"    pos="11.5 5.6 0"      scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-timeline" pos="8.13 5.6 8.13"   scale="0.1 0.1 0.1" visible="false" collision_id="" />
  <Object id="cube" js_id="vp-overview" pos="0 26 10"       scale="0.1 0.1 0.1" visible="false" collision_id="" />

</Room>
</FireBoxRoom>
</body>
</html>
